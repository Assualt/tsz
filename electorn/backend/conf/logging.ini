[DEFAULT]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s

[LOGGING]
version=1.0

[handlers]
keys=fileHandler,consoleHandler,consoleFileHandler

[handler_fileHandler]
class=logging.FileHandler
level=INFO
formatter=jsonFormatter
args=('logs/app_%(date)s.log', 'a')

[handler_consoleHandler]
class=logging.StreamHandler
level=INFO
formatter=jsonFormatter
args=()

[handler_consoleFileHandler]
class=logging.FileHandler
level=INFO
formatter=consoleFormatter
args=('logs/console_%(date)s.log', 'a')

[formatters]
keys=jsonFormatter,consoleFormatter

[formatter_jsonFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s

[formatter_consoleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s

[loggers]
keys=root,fileLogger,consoleLogger

[logger_root]
level=INFO
handlers=consoleHandler

[logger_fileLogger]
level=INFO
handlers=fileHandler
qualname=electorn.file
propagate=0

[logger_consoleLogger]
level=INFO
handlers=consoleFileHandler
qualname=electorn.console
propagate=0
